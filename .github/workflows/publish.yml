# Publishes the package tarball built by `ci.yml` to npm using trusted publishing (OIDC)
# after a successful CI run on `main`
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Publish

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  publish-npm:
    # Only publish for successful CI runs from pushes to this repository
    # (the `branches` filter alone also matches PRs from forks whose branch is named `main`)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to download the package artifact from the CI run
      id-token: write # Required for npm trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm publish ./package/*.tgz --access public
